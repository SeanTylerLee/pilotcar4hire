<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#152238">
  <meta name="apple-itunes-app" content="app-id=6802048795">
  <meta name="description" content="Contact the Pilot Car 4 Hire team. Send a message about the directory, listings, or the app.">
  <title>Contact — Pilot Car 4 Hire</title>
  <link rel="canonical" href="https://www.pilotcar4hire.com/contact.html">
  <link rel="stylesheet" href="css/styles.css?v=70">
  <link rel="icon" href="images/favicon.ico" sizes="any">
  <link rel="icon" href="images/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="images/favicon-16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <header class="header">
    <a href="index.html" class="logo">
      <img src="images/logo.svg" alt="Pilot Car 4 Hire" class="logo-img">
    </a>
  </header>

  <main class="main page" id="main-content">
    <div class="page-inner">
      <div class="page-head">
        <p class="eyebrow">Contact</p>
        <h1 class="page-title">Get in touch</h1>
        <p class="page-subtitle">Questions about listings, the directory, or the app — send a message and we’ll get back to you.</p>
      </div>

      <form class="auth-form panel" id="contact-form" novalidate>
        <label class="field">
          <span class="field-label">Name</span>
          <input type="text" name="name" id="contact-name" required autocomplete="name" placeholder="Your name">
        </label>
        <label class="field">
          <span class="field-label">Email</span>
          <input type="email" name="email" id="contact-email" required autocomplete="email" placeholder="you@company.com">
        </label>
        <label class="field">
          <span class="field-label">Message</span>
          <textarea name="message" id="contact-message" rows="6" required placeholder="How can we help?"></textarea>
        </label>
        <p class="form-message" id="contact-message-status" hidden></p>
        <button type="submit" class="btn-submit">Send message</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bar">
      <p class="footer-copy">&copy; 2026 STL Apps LLC</p>
      <button type="button" class="footer-menu-toggle" id="footer-menu-toggle" aria-expanded="false" aria-controls="site-menu">
        <span class="footer-hamburger" aria-hidden="true"><span></span></span>
        Menu
      </button>
    </div>
    <div class="site-menu" id="site-menu" hidden>
      <button type="button" class="site-menu-backdrop" tabindex="-1" data-close-menu aria-label="Close menu"></button>
      <div class="site-menu-sheet" role="dialog" aria-modal="true" aria-labelledby="site-menu-title" tabindex="-1">
        <p class="site-menu-title" id="site-menu-title">Menu</p>
        <nav class="site-menu-nav">
          <a href="index.html#map">Find pilot cars</a>
          <a href="pilot-cars.html">Pilot car directory</a>
          <a href="signup.html">List your service</a>
          <a href="account.html">Account</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
          <a href="privacy.html">Privacy</a>
          <a href="terms.html">Terms</a>
        </nav>
        <button type="button" class="site-menu-close" data-close-menu>Close</button>
      </div>
    </div>
    <span class="version-badge" id="site-version" hidden></span>
  </footer>

  <script src="js/config.js?v=67"></script>
  <script src="js/menu.js?v=70"></script>
  <script src="js/studioInbox.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
